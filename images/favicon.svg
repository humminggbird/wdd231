<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jd" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38F9C0"/>
      <stop offset="0.55" stop-color="#5AD1FF"/>
      <stop offset="1" stop-color="#7B61FF"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 32 32" to="360 32 32" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <mask id="cut">
      <rect width="64" height="64" rx="14" fill="#fff"/>
      <text x="32" y="33" fill="#000" font-family="Inter, Helvetica Neue, Arial, sans-serif"
            font-size="30" font-weight="800" letter-spacing="-1"
            text-anchor="middle" dominant-baseline="central">JD</text>
    </mask>
  </defs>
  <!-- gradient body with the JD punched through to transparency -->
  <rect width="64" height="64" rx="14" fill="url(#jd)" mask="url(#cut)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1E3A45" stroke-width="2"/>
</svg>
